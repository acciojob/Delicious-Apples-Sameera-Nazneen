    <div class="main-container">
      <div class="photo_container">

          <img
            src="https://media.istockphoto.com/id/2216682978/photo/green-apple.webp?a=1&b=1&s=612x612&w=0&k=20&c=RaML132T9eUZBs8jtw7UUdZ5hVkm9JkqzCLnHMzDAWo="
          />
        </div>
        <div class="photo-album">
          <ul type = "none">
            <li>
              <img
                src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
              />
            </li>
            <li>
              <img
                src="https://media.istockphoto.com/id/155387764/photo/green-apple-cross-section-clipping-path-included.webp?a=1&b=1&s=612x612&w=0&k=20&c=Auo8zoXV5pSvA-T92NibWctHZ6LooF9HVlGw-MTHSmI="
              />
            </li>
            <li>
              <img
                src="https://plus.unsplash.com/premium_photo-1661293868481-c6faa2d97d31?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fGdyZWVuJTIwYXBwbGV8ZW58MHx8MHx8fDA%3D"
              />
            </li>
            <li>
              <img
                src="https://images.unsplash.com/photo-1648565115203-21ae69e819cc?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              />
            </li>
          </ul>
        </div>
      </div>
      <div class="content">
        <h1>Delicious Apples</h1>
        <div class="price">
          <h2>$7.93</h2>
          <h3>SELECT A COLOR</h3>
          <div class="variant">
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
            />
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png"
            />
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png"
            />
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png"
            />
          </div>
          <h3>BENEFITS</h3>
          <div class="description">
            <ul>
              <li>Apples are nutricious</li>
              <li>Apples may be good for weight loss</li>
              <li>Apples may be good for bone health</li>
              <li>They're linked to a lowest risk of diabetes</li>
            </ul>
          </div>
          <div class="button">
            <button>ADD TO CART</button>
          </div>
        </div>
      </div>
    </div>
